name: Documentation

# Documentation is validated locally with `zensical build --strict` until the
# site is mature enough to justify automatic CI. Run this workflow manually
# when a full CI build is needed.
#
# When automatic docs CI is justified, replace `workflow_dispatch` with a
# path-filtered `push` trigger on `main`, for example:
#   push:
#     branches: [main]
#     paths:
#       - "docs/**"
#       - "tools/docs/**"
#       - ".github/workflows/docs.yml"
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt

      - name: Install documentation tools
        run: |
          python -m pip install -r tools/docs/requirements.txt
          python -m pip install -e src/python

      - name: Restore and build .NET assemblies
        run: |
          dotnet restore Mocassin.slnx
          dotnet build Mocassin.slnx -c Release --no-restore
          dotnet tool restore

      - name: Build combined site
        run: ./tools/docs/build-docs.sh

      - name: Upload documentation site
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          retention-days: 7
          path: site
          if-no-files-found: error

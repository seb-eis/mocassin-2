name: Nightly

# Intentionally disabled in repository settings until real long-running suites
# exist. If it is re-enabled, keep it weekly and Ubuntu-only. See
# `docs/planning/ci-policy.md`.
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  placeholder:
    name: Nightly placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Report pending nightly suites
        run: |
          echo "Long-running statistical parity, fuzzing, benchmark, and screenshot suites"
          echo "are enabled as the corresponding solver, results, and GUI steps land."

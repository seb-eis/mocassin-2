name: Nightly

# Manual placeholder. Do not add a schedule until real long-running suites
# exist; a scheduled placeholder spends CI minutes without testing anything.
# See `docs/planning/ci-policy.md`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  placeholder:
    name: Nightly placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Report pending nightly suites
        run: |
          echo "Long-running statistical parity, fuzzing, benchmark, and screenshot suites"
          echo "are enabled as the corresponding solver, results, and GUI steps land."

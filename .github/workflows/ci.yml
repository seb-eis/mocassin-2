name: CI

# Cost policy: automatic CI runs only on `main`, on Ubuntu, with path filters.
# The step closeout run is a single manual dispatch on the step branch. There
# are no per-feature or per-push step-branch runs.
#
# The Ubuntu run is the full gate: the complete .NET test suite with coverage,
# the format check, Rust, Python, contracts/policy, public API compatibility,
# and the process/binding checks.
#
# Windows and macOS are manual platform gates and are deliberately focused.
# They build the solution, then run the package-writer, results-reader, and CLI
# test projects (`Mocassin.Packages.Tests`, `Mocassin.Results.Tests`,
# `Mocassin.Cli.Tests`), which cover the platform-sensitive behaviour: P/Invoke
# directory fsync, atomic rename, temporary-file handling, the SQLite reader's
# path and locking behaviour, and the guarded Ctrl+C/SIGTERM signal path plus
# the Windows `mocassin-sim.exe` probe selection. A platform gate does not
# repeat the boilerplate suite, coverage, or the format check. The Rust,
# Python, contracts, process/binding, and API-compatibility jobs
# are Ubuntu-only by job condition: they run on a `push` to `main` or when
# `platforms` is `ubuntu`/`all`, never for `windows` or `macos`.
# `platforms=windows` therefore runs the short Ubuntu `changes` job plus one
# Windows job, not the Ubuntu suite.
#
# macOS stays fully manual until there is macOS-specific behaviour to validate.
# Documentation has its own manual workflow in `docs.yml`.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platform gate: ubuntu is the full suite, windows/macos the focused platform tests"
        type: choice
        options:
          - ubuntu
          - windows
          - macos
          - all
        default: ubuntu
      force_all:
        description: "Run every job regardless of changed paths"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      contracts: ${{ steps.filter.outputs.contracts }}
      api: ${{ steps.filter.outputs.api }}
      process: ${{ steps.filter.outputs.process }}
      os: ${{ steps.filter.outputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PLATFORMS: ${{ inputs.platforms || 'ubuntu' }}
          FORCE_ALL: ${{ inputs.force_all || false }}
        run: |
          set -euo pipefail

          all=false
          if [[ "$FORCE_ALL" == "true" ]]; then
            all=true
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            base="${BEFORE_SHA}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              echo "No usable push base; treating all paths as changed."
              all=true
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
          elif git fetch --no-tags origin main; then
            base="$(git merge-base HEAD FETCH_HEAD)"
          else
            echo "Could not fetch main; treating all paths as changed."
            all=true
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          echo "Comparing ${base}..HEAD"
          changed="$(git diff --name-only "$base" HEAD || true)"
          if [[ -n "$changed" ]]; then
            printf '%s\n' "$changed"
          else
            echo "(no changed files)"
          fi

          dotnet=false
          rust=false
          python=false
          contracts=false
          api=false
          process=false
          ci=false

          while IFS= read -r file; do
            case "$file" in
              src/dotnet/*|tests/*|*.slnx|global.json|.editorconfig|Directory.Build.*|Directory.Packages.props|NuGet.config|.config/dotnet-tools.json|tools/structure-policy.json)
                dotnet=true ;;
              src/rust/*|Cargo.toml|Cargo.lock|rust-toolchain*|deny.toml|.cargo/*)
                rust=true ;;
              src/python/*|pyproject.toml)
                python=true ;;
              tools/contracts/*|tools/symmetry/*|tools/check-license-headers.py|tools/check-no-secrets.py)
                contracts=true ;;
              tools/check-api-compat.sh|tools/update-api-baseline.sh|tools/api-projects.txt)
                api=true ;;
              README.md|CONTRIBUTING.md|SECURITY.md|.opencode/*|AGENTS.md|GLOSSARY.md|opencode.json|docs/**|docs/development/*|docs/planning/reviews/*|docs/planning/audits/*|docs/planning/README.md|docs/planning/04-roadmap.md|docs/planning/ci-policy.md|docs/planning/status.md|docs/planning/maintenance/*|docs/planning/drift-checks/*|docs/planning/closeout/*|docs/planning/incidents/*|docs/planning/research/*|docs/planning/prototypes/*|docs/planning/retrospectives/*|zensical.toml|tools/check_process_consistency.py|tools/check_closeout_evidence.py|tools/check_docs_links.py|tools/check_doc_math.py|tools/verify.sh|tools/tests/*)
                process=true ;;
              .github/workflows/ci.yml)
                ci=true ;;
            esac
          done <<< "$changed"

          # License, secret, and dependency checks run for any code change.
          if [[ "$dotnet" == "true" || "$rust" == "true" || "$python" == "true" ]]; then
            contracts=true
          fi
          # Public API compatibility is a .NET concern.
          if [[ "$dotnet" == "true" ]]; then
            api=true
          fi
          # A CI-workflow change validates the whole pipeline, including the
          # process/binding guardrails the workflow itself invokes.
          if [[ "$ci" == "true" ]]; then
            all=true
            process=true
          fi

          if [[ "$all" == "true" ]]; then
            dotnet=true
            rust=true
            python=true
            contracts=true
            api=true
            process=true
          fi

          # Ubuntu is the full gate. A platform gate targets exactly the
          # selected runners; it never implies an Ubuntu run, so the focused
          # Windows/macOS job is the only thing that is billed.
          case "$PLATFORMS" in
            ubuntu) os='["ubuntu-latest"]' ;;
            windows) os='["windows-latest"]' ;;
            macos) os='["macos-latest"]' ;;
            all) os='["ubuntu-latest","windows-latest","macos-latest"]' ;;
            *)
              echo "Invalid platforms input: ${PLATFORMS}" >&2
              exit 2
              ;;
          esac

          {
            echo "dotnet=${dotnet}"
            echo "rust=${rust}"
            echo "python=${python}"
            echo "contracts=${contracts}"
            echo "api=${api}"
            echo "process=${process}"
            echo "os=${os}"
          } >> "$GITHUB_OUTPUT"

  dotnet:
    name: .NET (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Main runs are Ubuntu-only; cancel siblings on failure. Manual platform
      # gates must be allowed to finish so the Windows/macOS result is visible.
      fail-fast: ${{ github.event_name == 'push' }}
      matrix:
        # `changes` yields only the selected platform: `windows` is Windows
        # alone, `all` is the three-platform sweep.
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore Mocassin.slnx

      - name: Build
        run: dotnet build Mocassin.slnx -c Release --no-restore

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test Mocassin.slnx -c Release --no-build
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      # Platform gates are a focused check, not a second full run: only the
      # projects that exercise OS-specific file, path, and locking behaviour.
      - name: Platform tests - package writer
        if: matrix.os != 'ubuntu-latest'
        run: >
          dotnet test src/dotnet/Mocassin.Packages.Tests/Mocassin.Packages.Tests.csproj
          -c Release --no-build

      - name: Platform tests - results reader
        if: matrix.os != 'ubuntu-latest'
        run: >
          dotnet test src/dotnet/Mocassin.Results.Tests/Mocassin.Results.Tests.csproj
          -c Release --no-build

      - name: Platform tests - CLI signal and probe paths
        if: matrix.os != 'ubuntu-latest'
        run: >
          dotnet test src/dotnet/Mocassin.Cli.Tests/Mocassin.Cli.Tests.csproj
          -c Release --no-build

      - name: Platform tests - Avalonia headless workspace
        if: matrix.os != 'ubuntu-latest'
        run: >
          dotnet test src/dotnet/Mocassin.App.Tests/Mocassin.App.Tests.csproj
          -c Release --no-build

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Mocassin.slnx --verify-no-changes --no-restore

      - name: Upload test results
        if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results-${{ matrix.os }}
          retention-days: 7
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: ignore

  rust:
    name: Rust
    needs: changes
    # Rust is platform-neutral so far and the platform gate is a .NET gate.
    # The job is Ubuntu-only: a Windows/macOS dispatch must not start it even
    # when the Rust paths changed.
    if: needs.changes.outputs.rust == 'true' && (github.event_name == 'push' || inputs.platforms == 'ubuntu' || inputs.platforms == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - name: Format
        run: cargo fmt --manifest-path src/rust/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path src/rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src/rust/Cargo.toml --workspace

      - name: Release build
        run: cargo build --manifest-path src/rust/Cargo.toml --workspace --release

  python:
    name: Python (${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.python == 'true' && (github.event_name == 'push' || inputs.platforms == 'ubuntu' || inputs.platforms == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        # The full 3.11/3.12/3.13 matrix is a manual/nightly concern for now.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "src/python[test]" build

      - name: Test with coverage
        run: |
          mkdir -p artifacts
          python -m pytest src/python/tests \
            --junitxml=artifacts/pytest-${{ matrix.python-version }}.xml \
            --cov=mocassin \
            --cov-report=xml:artifacts/coverage-python-${{ matrix.python-version }}.xml

      - name: Build wheel and sdist
        run: python -m build src/python

      - name: Upload test results and distributions
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.python-version }}
          retention-days: 7
          path: |
            artifacts/pytest-*.xml
            artifacts/coverage-python-*.xml
            src/python/dist/*
          if-no-files-found: ignore

  contracts:
    name: Contracts and policy
    needs: changes
    if: needs.changes.outputs.contracts == 'true' && (github.event_name == 'push' || inputs.platforms == 'ubuntu' || inputs.platforms == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Contract drift
        run: python tools/contracts/generate.py --check

      # The symmetry generator is present from Step 02. The guard keeps older
      # branches and pre-Step-02 snapshots runnable.
      - name: Install symmetry generator tools
        if: hashFiles('tools/symmetry/requirements.txt') != ''
        run: python -m pip install -r tools/symmetry/requirements.txt

      - name: Space-group catalog drift
        if: hashFiles('tools/symmetry/generate_space_groups.py') != ''
        run: python tools/symmetry/generate_space_groups.py --check

      - name: Licence headers
        run: python tools/check-license-headers.py

      - name: Secret scan
        run: python tools/check-no-secrets.py

      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: "0.20.2"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}"
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            "${base}/${archive}" -o "/tmp/${archive}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            "${base}/${archive}.sha256" -o "/tmp/${archive}.sha256"
          expected="$(cat "/tmp/${archive}.sha256")"
          actual="$(sha256sum "/tmp/${archive}" | awk '{print $1}')"
          if [[ "$expected" != "$actual" ]]; then
            echo "cargo-deny checksum mismatch" >&2
            exit 1
          fi
          tar -xzf "/tmp/${archive}" -C "$HOME/.local/bin" --strip-components=1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cargo-deny" --version

      - name: Rust dependency policy
        run: cargo deny --manifest-path src/rust/Cargo.toml check

  process:
    name: Process and binding checks
    needs: changes
    if: needs.changes.outputs.process == 'true' && (github.event_name == 'push' || inputs.platforms == 'ubuntu' || inputs.platforms == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The process checkers use only the standard library. The existing
      # projection test requires msgpack, so install only the pinned contracts
      # requirements; this job still builds neither .NET nor Rust.
      - name: Install contracts test requirements
        run: python -m pip install -r tools/contracts/requirements.txt

      - name: Process consistency
        run: python tools/check_process_consistency.py

      - name: Documentation links
        run: python tools/check_docs_links.py

      - name: Documentation math conventions
        run: python tools/check_doc_math.py

      # Same discovery root as `tools/verify.sh`, so CI and the local gate run
      # the identical test set.
      - name: Tool tests
        run: python -m unittest discover -s tools/tests -t .

  api-compat:
    name: Public API compatibility
    needs: changes
    if: needs.changes.outputs.api == 'true' && (github.event_name == 'push' || inputs.platforms == 'ubuntu' || inputs.platforms == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore Mocassin.slnx

      - name: Build
        run: dotnet build Mocassin.slnx -c Release --no-restore

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: NuGet licence policy
        run: python tools/contracts/check_nuget_licenses.py

      - name: NuGet vulnerability audit
        run: |
          output=$(dotnet list Mocassin.slnx package --vulnerable --include-transitive)
          echo "$output"
          if grep -q "has the following vulnerable packages" <<< "$output"; then
            exit 1
          fi

      - name: Restore local tools
        run: dotnet tool restore

      - name: Compare against baseline
        run: ./tools/check-api-compat.sh
